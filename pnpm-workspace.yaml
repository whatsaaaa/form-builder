packages:
  - apps/*
  - packages/*

# Install scripts that may run. unrs-resolver's postinstall only re-downloads the native
# binding, which pnpm already installs through its optional platform packages.
allowBuilds:
  unrs-resolver: false

# Versions shared by more than one workspace package. Reference them with `catalog:`.
catalog:
  '@types/node': ^24.13.4
  '@tsconfig/node24': ^24.0.5
  typescript: ~6.0.3
  valibot: ^1.5.0
  vue-tsc: ^3.3.11
