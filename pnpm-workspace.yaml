packages:
  - apps/*
  - frameworks/*
  - integration
  - packages/*

# Install scripts that may run. The postinstalls of unrs-resolver and esbuild (used by
# size-limit), and of @parcel/watcher, lmdb and msgpackr-extract (used by @angular/build in the
# integration tests), only re-download, check or build the native binding, which pnpm already
# installs through their optional platform packages.
allowBuilds:
  '@parcel/watcher': false
  esbuild: false
  lmdb: false
  msgpackr-extract: false
  unrs-resolver: false

# Versions shared by more than one workspace package. Reference them with `catalog:`.
catalog:
  '@types/node': ^24.13.4
  '@tsconfig/node24': ^24.0.5
  typescript: ~6.0.3
  valibot: ^1.5.0
  vue-tsc: ^3.3.11

# @qwik.dev/core wants Vitest below 5 for its own test helpers, which the integration tests don't
# use. They render with Qwik's render() in jsdom.
peerDependencyRules:
  allowedVersions:
    '@qwik.dev/core>vitest': '5'
    # @angular/build's WebAssembly build of oxc-parser, which only loads where there's no native
    # one, brings an @emnapi prerelease that @napi-rs/wasm-runtime's range leaves out.
    '@napi-rs/wasm-runtime>@emnapi/core': '2.0.0-alpha.6'
    '@napi-rs/wasm-runtime>@emnapi/runtime': '2.0.0-alpha.6'
