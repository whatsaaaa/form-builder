# Builds the VitePress site in apps/docs and deploys it to GitHub Pages at
# https://whatsaaaa.github.io/form-builder/, through the shared pages workflow.
name: Pages

on:
  push:
    branches: [main]
    paths:
      - apps/docs/**
      # The framework pages show these renderers as they are.
      - integration/examples/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions: {}

# One deployment at a time, and an in-progress deployment is never cancelled
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    uses: whatsaaaa/template/.github/workflows/pages.yml@v1
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      build-script: docs:build
      artifact-path: apps/docs/.vitepress/dist
      # lastUpdated reads each page's time from the git history.
      fetch-depth: 0
