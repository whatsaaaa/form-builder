name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One deployment at a time, and an in-progress deployment is never cancelled
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  pages:
    uses: whatsaaaa/template/.github/workflows/pages.yml@v1
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      artifact-path: apps/docs/dist
