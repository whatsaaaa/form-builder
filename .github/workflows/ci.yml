name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The checks are named `ci / check`, which the main ruleset requires
  ci:
    uses: whatsaaaa/template/.github/workflows/node-ci.yml@v1
