name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4 # use the latest major
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - name: Fail if lint auto-fixed anything
        run: git diff --exit-code
      - run: pnpm type-check
      - run: pnpm -r --filter '!@whatsaaaa/form-builder-schema' test
      - run: pnpm --filter @whatsaaaa/form-builder-schema test:coverage
      - run: pnpm --filter @whatsaaaa/form-builder-schema docs:gen
      - name: Fail if the generated files are out of date
        run: git diff --exit-code
      - run: pnpm build
      - run: pnpm -r --filter "./packages/*" --filter "./frameworks/*" lint:pkg
      - run: pnpm --filter @whatsaaaa/form-builder-schema size

  # The schema tests again, with the lowest Valibot and @valibot/to-json-schema the peer ranges
  # allow.
  valibot-min:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4 # use the latest major
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install with Valibot 1.3.0 and @valibot/to-json-schema 1.6.0
        working-directory: packages/schema
        run: |
          npm pkg set devDependencies.valibot=1.3.0
          npm pkg set devDependencies.@valibot/to-json-schema=1.6.0
          pnpm install --no-frozen-lockfile
      - run: pnpm --filter @whatsaaaa/form-builder-schema test:coverage
