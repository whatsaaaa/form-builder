name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Codecov takes the coverage uploads by OIDC, with no token.
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # use the latest major
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - name: Fail if lint auto-fixed anything
        run: git diff --exit-code
      - run: pnpm type-check
      - run: pnpm -r --filter '!@whatsaaaa/form-builder-schema' --filter '!@whatsaaaa/form-builder-affects' --filter '!@whatsaaaa/form-builder-vue' --filter '!@whatsaaaa/form-builder-react' test
      - run: pnpm --filter @whatsaaaa/form-builder-schema --filter @whatsaaaa/form-builder-affects --filter @whatsaaaa/form-builder-vue --filter @whatsaaaa/form-builder-react test:coverage
      # Codecov maps each flag to its package by path, so every lcov path must start with that
      # package's directory.
      - name: Check the lcov paths are from the repo root
        run: |
          for package in packages/schema packages/affects frameworks/vue frameworks/react; do
            report="$package/coverage/lcov.info"
            grep -q '^SF:' "$report" || { echo "$report has no SF lines"; exit 1; }
            if grep '^SF:' "$report" | grep -v "^SF:$package/"; then
              echo "$report has paths outside $package/"
              exit 1
            fi
          done
      - name: Upload schema coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          flags: schema
          files: packages/schema/coverage/lcov.info
          disable_search: true
          # Coverage is a report, not a gate: the thresholds in vitest.config.ts are.
          fail_ci_if_error: false
      - name: Upload affects coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          flags: affects
          files: packages/affects/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false
      - name: Upload vue coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          flags: vue
          files: frameworks/vue/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false
      - name: Upload react coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          use_oidc: true
          flags: react
          files: frameworks/react/coverage/lcov.info
          disable_search: true
          fail_ci_if_error: false
      - run: pnpm --filter @whatsaaaa/form-builder-schema --filter @whatsaaaa/form-builder-affects docs:gen
      - name: Fail if the generated files are out of date
        run: git diff --exit-code
      - run: pnpm build
      - run: pnpm docs:build
      - run: pnpm -r --filter "./packages/*" --filter "./frameworks/*" lint:pkg
      - run: pnpm --filter @whatsaaaa/form-builder-schema --filter @whatsaaaa/form-builder-affects --filter @whatsaaaa/form-builder-react size

  # The schema and affects tests again, with the lowest Valibot and @valibot/to-json-schema the
  # peer ranges allow.
  valibot-min:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # use the latest major
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install with Valibot 1.3.0 and @valibot/to-json-schema 1.6.0
        run: |
          for package in packages/schema packages/affects; do
            (cd "$package" && npm pkg set devDependencies.valibot=1.3.0 devDependencies.@valibot/to-json-schema=1.6.0)
          done
          pnpm install --no-frozen-lockfile
      - run: pnpm --filter @whatsaaaa/form-builder-schema --filter @whatsaaaa/form-builder-affects test:coverage

  # The React adapter's tests and types again, with React 18, the lowest major its peer range allows.
  react-18:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # use the latest major
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install with React 18
        working-directory: frameworks/react
        run: |
          npm pkg set devDependencies.react=18.3.1 devDependencies.react-dom=18.3.1
          npm pkg set devDependencies.@types/react=^18.3.0 devDependencies.@types/react-dom=^18.3.0
          pnpm install --no-frozen-lockfile
      - run: pnpm --filter @whatsaaaa/form-builder-react test:coverage
      - run: pnpm --filter @whatsaaaa/form-builder-react type-check
